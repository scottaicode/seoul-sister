<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Seoul Sister">
  <title>Seoul Sister — Direction B2, refined twin S</title>
  <!--
    B2 — refinement of Direction B, which was the only one of three that read as
    "SS" at 40px.

    Changes from B:
      - Mark scaled up and centred properly (B sat high with a dead band below).
      - Underline thinned 30 -> 22 and shortened to the letter width, so it reads
        as a base rule rather than a second element competing with the letters.
      - Slightly more air between the two S's so the counters stay open small.
  -->
  <rect width="512" height="512" fill="#0D0D0F"/>
  <g fill="none" stroke="#E8C97A" stroke-width="46" stroke-linecap="round">
    <!-- Left S -->
    <path d="M248 186
             C248 150, 210 133, 183 146
             C154 160, 152 197, 181 211
             C210 226, 241 238, 241 275
             C241 311, 202 328, 173 315
             C152 306, 142 286, 142 269" />
    <!-- Right S -->
    <path d="M370 186
             C370 150, 332 133, 305 146
             C276 160, 274 197, 303 211
             C332 226, 363 238, 363 275
             C363 311, 324 328, 295 315
             C274 306, 264 286, 264 269" />
  </g>
  <!-- Base rule: lighter and narrower than B's, tuned to sit under the letters -->
  <path d="M160 384 H352" fill="none" stroke="#C9A55C" stroke-width="22" stroke-linecap="round"/>
</svg>
