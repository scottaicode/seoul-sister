<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Seoul Sister">
  <title>Seoul Sister (light)</title>
  <!--
    Seoul Sister — the interlocked double-S, CALLIGRAPHIC.

    Bailey's mark, July 29 2026. My first attempt was rejected and correctly so:
    Scott, "Not really digging your version, it's much different than hers." It was
    a uniform-width rounded stroke — a monoline squiggle. Hers is a calligraphic
    letterform, and three features carry that:

      1. STROKE CONTRAST. The width swells through the bowls and tapers to near
         nothing at the ends. A constant-width stroke reads as a squiggle; the
         modulation is what makes it read as lettering.
      2. POINTED TERMINALS. Those hairline spurs at upper-right and lower-left are
         the whole signature of the mark. round linecaps destroy them.
      3. TWO OVERLAPPING GLYPHS, not one ribbon. Two S's — upper-left and
         lower-right — crossing diagonally into a knot. One continuous path
         cannot produce the overlap.

    So this is FILLED OUTLINES, not a stroked path. Generated by offsetting an
    S-spine along its normal by a width function, then fitting Catmull-Rom
    cubics. Each glyph is rotated -18deg so the composition runs lower-left to
    upper-right, matching her comp.

    Measured: 346 x 400 in a 512 frame, centred exactly on (256, 256).

    DO NOT convert this back to a single <path stroke="..."> — that is precisely
    the version that was rejected. If it needs to be lighter at very small sizes,
    raise the MINIMUM width in the generator rather than flattening the contrast.
  -->
  <rect width="512" height="512" fill="#FAF7F2"/>
  <g fill="#1F2430" fill-rule="nonzero">
    <path d="M246 174C247 171 250 160 252 153C253 145 254 137 254 128C253 120 252 110 249 102C245 94 239 86 233 79C226 73 218 67 209 63C200 60 190 57 181 56C171 55 161 56 152 58C142 60 133 64 124 70C116 75 109 82 102 89C96 97 91 106 88 115C85 124 83 133 83 143C83 152 84 162 87 170C90 179 95 187 100 194C105 201 112 207 119 211C126 215 115 205 143 218C170 231 258 281 284 287C310 292 297 261 298 251C299 241 294 233 290 225C286 217 280 209 273 203C266 197 258 191 249 187C241 183 231 181 221 180C212 179 201 180 192 182C182 184 173 188 165 194C156 199 149 206 143 213C137 221 132 230 128 239C125 247 123 257 123 267C123 276 125 286 129 294C132 302 138 309 144 316C150 322 156 327 163 331C169 336 179 340 183 342C186 343 187 341 185 338C183 335 174 329 170 324C167 318 164 311 163 305C162 299 164 293 164 287C165 281 166 276 168 272C170 267 172 262 174 258C176 254 179 251 183 248C186 245 189 242 193 240C197 238 201 236 205 235C209 233 214 233 218 233C223 232 227 233 232 234C237 235 241 236 246 239C250 241 254 244 258 247C262 251 264 257 269 260C274 263 310 274 290 266C269 259 171 226 145 214C118 203 137 202 134 196C131 190 128 185 127 179C126 174 125 168 125 163C125 158 126 152 128 148C129 143 131 139 134 135C136 131 139 127 142 124C145 121 149 118 153 116C157 114 161 112 165 111C169 110 174 109 178 109C183 109 187 109 192 110C196 111 201 113 205 115C210 117 214 119 219 123C224 126 229 130 233 135C236 140 240 146 241 153C243 159 241 170 241 173C242 177 244 177 246 174Z"/>
