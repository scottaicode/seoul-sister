<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Seoul Sister">
<title>Seoul Sister</title>
<!-- FAVICON, 32px. A favicon is a DIFFERENT DRAWING, not a shrunk logo.
     The full two-S serif monogram measured as mush at 32px and unreadable NOISE at
     16px - high-contrast serif hairlines cannot survive a favicon, which is the same
     reason Bailey's original Canva ribbon could not be the icon.
     So: ONE letter (double the pixel budget per stroke) in POPPINS BOLD - the
     wordmark's own typeface, uniform stroke weight, no hairlines to lose. Verified
     legible at 16px by rendering and looking, not assumed. -->
<defs><linearGradient id="t" x1="0.1" y1="0" x2="0.6" y2="1">
<stop offset="0%" stop-color="#EDCB8B"/><stop offset="45%" stop-color="#CFA257"/>
<stop offset="100%" stop-color="#A87F38"/></linearGradient></defs>
<rect width="32" height="32" rx="6" fill="url(#t)"/>
