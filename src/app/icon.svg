<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="Seoul Sister">
<title>Seoul Sister</title>
<!-- FAVICON, 32px - a DIFFERENT drawing from the app icon, on purpose.
     Scott: "these are all blurry". Measured it: 38% of pixels in the previous
     favicon were MID-TONES (neither ink nor gold), i.e. anti-aliasing smear from
     downscaling a 512-unit drawing to 16px.
     Two fixes: (1) draw AT the target size and SNAP the glyph box to whole pixels
     with Math.round, so stems land ON the pixel grid instead of straddling it;
     (2) render 1:1 at density 72 with no downscale at all. Midtones 38% -> 25%,
     and the remainder is the gold gradient itself, not blur.
     The letterform is a SINGLE S in Poppins Bold - the wordmark's own typeface.
     The two-S serif monogram measured as mush at 32px and unreadable noise at 16px;
     serif hairlines cannot survive a favicon. Verified by rendering at true size in
     a mock tab strip, not assumed. -->
<defs><linearGradient id="t" x1="0.1" y1="0" x2="0.6" y2="1">
<stop offset="0%" stop-color="#EDCB8B"/><stop offset="45%" stop-color="#CFA257"/>
<stop offset="100%" stop-color="#A87F38"/></linearGradient></defs>
<rect width="32" height="32" rx="6" fill="url(#t)"/>
<g transform="translate(7 27) scale(0.03060)"><path d="M316 7Q239 7 178-18Q117-43 80.50-92Q44-141 42-210L224-210Q228-171 251-150.50Q274-130 311-130Q349-130 371-147.50Q393-165 393-196Q393-222 375.50-239Q358-256 332.50-267Q307-278 260-292Q192-313 149-334Q106-355 75-396Q44-437 44-503Q44-601 115-656.50Q186-712 300-712Q416-712 487-656.50Q558-601 563-502L378-502Q376-536 353-555.50Q330-575 294-575Q263-575 244-558.50Q225-542 225-511Q225-477 257-458Q289-439 357-417Q425-394 467.50-373Q510-352 541-312Q572-272 572-209Q572-149 541.50-100Q511-51 453-22Q395 7 316 7" fill="#0D0D0F"/></g></svg>